name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Gradle build
        run: chmod +x gradlew && ./gradlew build -x test

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GIFOverlay-mod
          path: build/libs/*.jar
