# Отключаем проверку javadoc (решает ошибку IllegalStateException)
fabric.debug.disableJavadocProvider=true

# Увеличиваем память для сборки
org.gradle.jvmargs=-Xmx2G

# Включаем параллельную сборку для ускорения
org.gradle.parallel=true

# Отключаем проверку конфигурации (для совместимости)
org.gradle.configuration-cache=false
